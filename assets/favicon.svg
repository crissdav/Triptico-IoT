<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153728"/>
      <stop offset="1" stop-color="#0b1d14"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94bd66"/>
      <stop offset="1" stop-color="#6fa04a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- Greenhouse body -->
  <rect x="150" y="250" width="212" height="170" rx="20" fill="#1c4030" stroke="#5aa86a" stroke-width="12"/>

  <!-- Greenhouse roof -->
  <path d="M118 262 L256 128 L394 262 Z" fill="url(#roof)" stroke="#c7e3a0" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner plant: stem + leaves -->
  <g stroke="#5aa86a" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="404" x2="256" y2="330"/>
  </g>
  <path d="M256 366 C226 350 206 322 204 296 C236 306 254 330 256 366 Z" fill="#94bd66"/>
  <path d="M256 346 C286 332 304 306 306 280 C276 288 258 312 256 346 Z" fill="#5aa86a"/>

  <!-- IoT wifi arcs -->
  <g fill="none" stroke="#94bd66" stroke-width="14" stroke-linecap="round">
    <path d="M356 120 A 52 52 0 0 1 460 120"/>
    <path d="M380 156 A 26 26 0 0 1 436 156"/>
  </g>
  <circle cx="408" cy="192" r="12" fill="#94bd66"/>

  <!-- Ground line -->
  <rect x="150" y="404" width="212" height="16" rx="8" fill="#5aa86a"/>
</svg>